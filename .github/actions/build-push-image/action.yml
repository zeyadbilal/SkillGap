name: 'Build and Push Docker Image'
description: 'A reusable composite action to build and push docker images'

inputs:
  username:
    description: 'DockerHub Username'
    required: true
  password:
    description: 'DockerHub Token'
    required: true
  image_name:
    description: 'Name of the image (e.g., skillgap-backend)'
    required: true
  version_tag:
    description: 'The immutable version tag'
    required: true
  context_path:
    description: 'Path to the build context'
    required: true
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: true
  build_args:
    description: 'Optional build arguments'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context_path }}
        file: ${{ inputs.dockerfile_path }}
        push: true
        build-args: ${{ inputs.build_args }}
        tags: |
          ${{ inputs.username }}/${{ inputs.image_name }}:${{ inputs.version_tag }}
          ${{ inputs.username }}/${{ inputs.image_name }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.image_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
        provenance: false