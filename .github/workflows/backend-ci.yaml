name: backend-ci

on:
  push:
    branches:
      - "main"
      - "abdelrahman-deployment"
    paths: ['backend/**']
  pull_request:
    branches: ["main"]
    paths: ['backend/**']

jobs:
  code-check:
    name: code-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Code Check Action
        uses: ./.github/actions/code-check
        with:
          working-directory: 'backend'
          project-name: 'backend'
          node-version: ${{ matrix.node-version }}

  container-build:
    name: build-scan docker image
    runs-on: ubuntu-latest
    needs: code-check
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Docker Scan Action
        uses: ./.github/actions/docker-scan
        with:
          working-directory: 'backend'
          image-name: 'backend-service'
