name: model-ci

on:
    push:
        branches:
            - main
            - abdelrahman-deployment
        paths:
            - "model/**"
            - "DataPipeline/config/skills_dictionary.json"
            - "DataPipeline/tests/**"
            - "DataPipeline/core/**"
            - "DataPipeline/scripts/**"
            - "DataPipeline/scrapers/**"
            - ".github/workflows/model-ci.yaml"
    pull_request:
        branches:
            - main
        paths:
            - "model/**"
            - "DataPipeline/**"
            - ".github/workflows/model-ci.yaml"

jobs:
    python-tests:
        name: python-tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12"]

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: |
                      model/requirements.txt
                      DataPipeline/requirements.txt

            - name: Install Python dependencies
              run: python -m pip install -r model/requirements.txt -r DataPipeline/requirements.txt

            - name: Run data pipeline tests
              working-directory: DataPipeline
              run: python -m unittest discover -s tests -p 'test_*.py'

            - name: Compile model entrypoint
              run: python -m py_compile model/nlp/spacy_extractor.py

            - name: Smoke-test model output
              shell: bash
              run: |
                  output="$(printf 'Experienced Python developer with React and PostgreSQL.' | python model/nlp/spacy_extractor.py)"
                  python -c 'import json, sys; result = json.loads(sys.argv[1]); assert "detectedSkills" in result; assert result["textLength"] > 0' "$output"

    container-build:
        name: build and smoke-test model image
        runs-on: ubuntu-latest
        needs: python-tests

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Build model image
              run: docker build -f model/Dockerfile -t skillgap-model .

            - name: Smoke-test model container
              shell: bash
              run: |
                  output="$(printf 'Experienced Python developer.' | docker run --rm -i skillgap-model)"
                  python -c 'import json, sys; result = json.loads(sys.argv[1]); assert result["textLength"] > 0' "$output"
