name: model-ci

on:
  push:
    branches:
      - main
      - abdelrahman-deployment
    paths:
      - "model/**"
      - "DataPipeline/**"
      - ".github/actions/docker-scan/action.yml"
      - ".github/workflows/model-ci.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "model/**"
      - "DataPipeline/**"
      - ".github/actions/docker-scan/action.yml"
      - ".github/workflows/model-ci.yaml"

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            model/requirements.txt
            DataPipeline/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r model/requirements.txt -r DataPipeline/requirements.txt

      - name: Run model service tests
        run: python -m unittest discover -s model/service/tests -p 'test_*.py'

      - name: Run data pipeline tests
        working-directory: DataPipeline
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile model service
        run: python -m compileall -q model/service

  container-build:
    name: build-scan model image
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Docker Scan Action
        uses: ./.github/actions/docker-scan
        with:
          working-directory: "model"
          build-context: "."
          dockerfile: "model/Dockerfile"
          image-name: "model-service"
