name: frontend-ci

on:
  push:
    branches: 
      - "main"
      - "abdelrahman-deployment"
    paths: 
      - 'frontend/**'
  pull_request:
    branches: 
      - "main"
    paths: 
      - 'frontend/**'

jobs:
  code-check:
    name: frontend-code-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]


    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Code Check Action
        uses: ./.github/actions/code-check
        with:
          working-directory: 'frontend'
          project-name: 'frontend'
          node-version: ${{ matrix.node-version }}
          run-build: 'true'

  container-build:
    name: build-scan frontend image
    runs-on: ubuntu-latest
    needs: code-check
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Docker Scan Action
        uses: ./.github/actions/docker-scan
        with:
          working-directory: 'frontend'
          image-name: 'frontend-service'