apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillgap.backendName" . }}
  labels:
    {{- include "skillgap.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "skillgap.backendName" . }}
  ports:
    - name: service-port
      port: {{ .Values.backend.service.port }}
      targetPort: container-port


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillgap.backendName" . }}
  labels:
    {{- include "skillgap.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "skillgap.backendName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "skillgap.backendName" . }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: container-port
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: NODE_ENV
              value: {{ .Values.backend.env.nodeEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.logLevel | quote }}
            - name: PG_POOL_MAX
              value: {{ .Values.backend.env.pgPoolMax | quote }}
            - name: PG_POOL_MIN
              value: {{ .Values.backend.env.pgPoolMin | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillgap.fullname" . }}-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillgap.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillgap.fullname" . }}-secrets
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /health
              port: container-port
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: container-port
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}