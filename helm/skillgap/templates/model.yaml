apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillgap.modelName" . }}
  namespace: {{ include "skillgap.namespaceName" . }}
  labels:
    {{- include "skillgap.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  type: {{ .Values.model.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "skillgap.modelName" . }}
  ports:
    - name: service-port
      port: {{ .Values.model.service.port }}
      targetPort: container-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillgap.modelName" . }}
  namespace: {{ include "skillgap.namespaceName" . }}
  labels:
    {{- include "skillgap.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  replicas: {{ .Values.replicaCount.model }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "skillgap.modelName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "skillgap.modelName" . }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: model
          image: "{{ .Values.model.image.repository }}:{{ .Values.model.image.tag }}"
          imagePullPolicy: {{ .Values.model.image.pullPolicy }}
          ports:
            - name: container-port
              containerPort: {{ .Values.model.service.port }}
          env:
            - name: MODEL_HOST
              value: {{ .Values.model.env.host | quote }}
            - name: MODEL_PORT
              value: {{ .Values.model.service.port | quote }}
          readinessProbe:
            tcpSocket:
              port: container-port
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: container-port
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.model.resources | nindent 12 }}