apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillgap.fullname" . }}-secrets
  labels:
    {{- include "skillgap.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret must be set" .Values.secrets.jwtSecret | quote }}
  database-url: {{ required "external.postgresUrl must be set to the Railway PostgreSQL URL" .Values.external.postgresUrl | quote }}
  redis-url: {{ required "external.redisUrl must be set to the Railway Redis URL" .Values.external.redisUrl | quote }}